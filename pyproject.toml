[project]
name = "drbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shingo.tsuji", email = "shingo.tsuji@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opentsne>=1.0.4",
    "pacmap>=0.9.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "trimap>=1.2.0",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
drbench = "drbench.cli:main"
